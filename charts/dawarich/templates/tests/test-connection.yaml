apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "dawarich.fullname" . }}-test-connection"
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # the Host header must match APPLICATION_HOSTS, otherwise Rails host authorization returns 403
      args:
        - '--header'
        - 'Host: {{ .Values.dawarich.hosts | first }}'
        - '-O'
        - '/dev/null'
        - 'http://{{ include "dawarich.fullname" . }}:{{ .Values.service.port }}/api/v1/health'
  restartPolicy: Never
