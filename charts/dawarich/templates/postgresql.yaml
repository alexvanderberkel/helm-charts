{{- if eq (include "dawarich.postgresqlBundledEnabled" . | trim) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dawarich.postgresqlName" . }}
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.port }}
      targetPort: postgresql
      protocol: TCP
  selector:
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dawarich.postgresqlName" . }}
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "dawarich.postgresqlName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "dawarich.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              {{- if .Values.postgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretKeys.usernameKey | default "username" }}
              {{- else }}
              value: {{ .Values.postgresql.auth.username | quote }}
              {{- end }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgresql.auth.existingSecret }}
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey | default "password" }}
                  {{- else }}
                  name: {{ include "dawarich.fullname" . }}
                  key: postgresPassword
                  {{- end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: {{ .Values.postgresql.port }}
              protocol: TCP
          readinessProbe:
            exec:
              command:
                {{- include "dawarich.postgresqlProbeCommand" . | nindent 16 }}
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                {{- include "dawarich.postgresqlProbeCommand" . | nindent 16 }}
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                {{- include "dawarich.postgresqlProbeCommand" . | nindent 16 }}
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
      volumes:
        {{- if and .Values.postgresql.persistence.enabled .Values.postgresql.persistence.existingClaim }}
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: {{ .Values.postgresql.persistence.existingClaim }}
        {{- else if not .Values.postgresql.persistence.enabled }}
        - name: postgresql-data
          emptyDir: {}
        {{- end }}
  {{- if and .Values.postgresql.persistence.enabled (not .Values.postgresql.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
        labels:
          {{- include "dawarich.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: postgresql
        {{- with .Values.postgresql.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.postgresql.persistence.accessMode | quote }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size | quote }}
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
