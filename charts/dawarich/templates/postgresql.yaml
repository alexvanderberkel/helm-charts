{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dawarich.postgresqlName" . }}
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.port }}
      targetPort: postgresql
      protocol: TCP
  selector:
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dawarich.postgresqlName" . }}-init
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
data:
  01-create-dawarich-user.sh: |
    #!/bin/sh
    set -e
    # This bootstrap script only runs when the PostgreSQL data directory is first initialized.
    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname postgres \
      --set=db_name="$POSTGRES_DB" \
      --set=db_user="$DAWARICH_DATABASE_USER" \
      --set=db_password="$DAWARICH_DATABASE_PASSWORD" <<'EOSQL'
    DO
    $$
    BEGIN
      IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = :'db_user') THEN
        EXECUTE format('ALTER ROLE %I LOGIN PASSWORD %L', :'db_user', :'db_password');
      ELSE
        EXECUTE format('CREATE ROLE %I LOGIN PASSWORD %L', :'db_user', :'db_password');
      END IF;
    END
    $$;
    SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'db_name', :'db_user') \gexec
    SELECT format('ALTER DATABASE %I OWNER TO %I', :'db_name', :'db_user') \gexec
    SELECT format('GRANT ALL ON SCHEMA public TO %I', :'db_user') \gexec
    SELECT format('ALTER SCHEMA public OWNER TO %I', :'db_user') \gexec
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dawarich.postgresqlName" . }}
  labels:
    {{- include "dawarich.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "dawarich.postgresqlName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "dawarich.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.postgresql.auth.existingSecret }}{{ .Values.postgresql.auth.existingSecret }}{{ else }}{{ include "dawarich.fullname" . }}{{ end }}
                  key: {{ if .Values.postgresql.auth.existingSecret }}{{ .Values.postgresql.auth.secretKeys.adminPasswordKey | default "postgres-password" }}{{ else }}postgresAdminPassword{{ end }}
            - name: DAWARICH_DATABASE_USER
              {{- if .Values.postgresql.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretKeys.usernameKey | default "username" }}
              {{- else }}
              value: {{ .Values.postgresql.auth.username | quote }}
              {{- end }}
            - name: DAWARICH_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.postgresql.auth.existingSecret }}{{ .Values.postgresql.auth.existingSecret }}{{ else }}{{ include "dawarich.fullname" . }}{{ end }}
                  key: {{ if .Values.postgresql.auth.existingSecret }}{{ .Values.postgresql.auth.secretKeys.userPasswordKey | default "password" }}{{ else }}postgresPassword{{ end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: {{ .Values.postgresql.port }}
              protocol: TCP
          readinessProbe:
            exec:
              command:
                {{- include "dawarich.postgresqlProbeCommand" . | nindent 16 }}
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                {{- include "dawarich.postgresqlProbeCommand" . | nindent 16 }}
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                {{- include "dawarich.postgresqlProbeCommand" . | nindent 16 }}
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
            - name: postgresql-init
              mountPath: /docker-entrypoint-initdb.d/01-create-dawarich-user.sh
              subPath: 01-create-dawarich-user.sh
      volumes:
        {{- if and .Values.postgresql.persistence.enabled .Values.postgresql.persistence.existingClaim }}
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: {{ .Values.postgresql.persistence.existingClaim }}
        {{- else if not .Values.postgresql.persistence.enabled }}
        - name: postgresql-data
          emptyDir: {}
        {{- end }}
        - name: postgresql-init
          configMap:
            name: {{ include "dawarich.postgresqlName" . }}-init
            defaultMode: 365 # decimal for 0555
  {{- if and .Values.postgresql.persistence.enabled (not .Values.postgresql.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
        labels:
          {{- include "dawarich.labels" . | nindent 10 }}
          app.kubernetes.io/component: postgresql
        {{- with .Values.postgresql.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.postgresql.persistence.accessMode | quote }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size | quote }}
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
