---
## Enable HAProxy to manage Load Balancing
## Configured for single-node Kind cluster in CI

# Avoid ECR Public rate limits on shared CI runners.
image:
  repository: docker.io/library/redis

# Reduce replicas for single-node cluster
replicas: 1

# Disable hard anti-affinity for CI testing
hardAntiAffinity: false

haproxy:
  enabled: true
  image:
    repository: docker.io/library/haproxy
  replicas: 1
  hardAntiAffinity: false
  annotations:
    any.domain/key: "value"
  serviceAccount:
    create: true
  metrics:
    enabled: true
